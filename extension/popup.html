<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 280px; margin: 0; padding: 12px; background: #121212; color: #fff; font: 14px system-ui, sans-serif; display: grid; gap: 8px; }
    input { padding: 8px; border-radius: 6px; border: 0; }
    .row { display: flex; gap: 6px; }
    button { flex: 1; padding: 8px; border: 0; border-radius: 999px; font-weight: 700; background: #1db954; color: #000; }
    #leave { background: #333; color: #fff; }
    button { cursor: pointer; }
    button:disabled { cursor: progress; opacity: .6; }
    #status { margin: 0; opacity: .85; min-height: 2.5em; }
    #time { margin: 0; font-family: ui-monospace, monospace; font-size: 12px; color: #1db954; }
    #time:empty { display: none; }
    small { opacity: .6; }
    #requests { display: grid; gap: 8px; border-top: 1px solid #333; padding-top: 8px; }
    #room-view { display: grid; gap: 10px; }
    #room-view[hidden] { display: none; }
    .card { display: flex; gap: 10px; align-items: center; background: #1e1e1e; border-radius: 10px; padding: 10px; }
    .card img, .card .ph { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; flex: none; background: #333; }
    .np-t { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .np-t b, .np-t span, .q-t b, .q-t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ctrls { display: flex; justify-content: center; gap: 10px; }
    .ctrls[hidden] { display: none; }
    .ctrls button { flex: none; width: 34px; height: 34px; padding: 0; background: #ffffff14; color: #fff; }
    .ctrls button:nth-child(2) { background: #fff; color: #000; }
    .members { display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: .85; }
    .stack { display: flex; }
    .av { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; display: inline-grid; place-items: center; font-size: 9px; font-weight: 700; margin-right: -6px; border: 2px solid #121212; }
    h4 { margin: 0; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; opacity: .6; }
    #queue { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 170px; overflow-y: auto; }
    #queue li { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    #queue img, #queue .ph { width: 30px; height: 30px; border-radius: 4px; object-fit: cover; flex: none; background: #333; }
    .q-t { flex: 1; min-width: 0; display: grid; }
    .q-t span { font-size: 11px; opacity: .6; }
    #queue button { flex: none; padding: 2px 8px; font-size: 11px; background: #333; color: #fff; }
    #requests[hidden] { display: none; }
    #req-form { display: flex; gap: 6px; }
    #req-form input { flex: 1; min-width: 0; }
    #req-form button { flex: none; padding: 8px 12px; }
    #req-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 180px; overflow-y: auto; }
    #req-list li { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    #req-list li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    #req-list li small { opacity: .6; }
    #req-list li button { flex: none; padding: 2px 8px; font-size: 11px; background: #333; color: #fff; }
  </style>
</head>
<body>
  <b>Listen Along</b>
  <input id="room" placeholder="Kode room atau link room" />
  <input id="name" maxlength="40" placeholder="Nama Anda (kosong = nama akun Spotify)" />
  <div class="row">
    <button id="join">Gabung di tab ini</button>
    <button id="leave">Keluar</button>
  </div>
  <p id="status"></p>
  <p id="time"></p>
  <section id="room-view" hidden>
    <div class="card" id="np"></div>
    <div class="ctrls" id="ctrls" hidden>
      <button type="button" data-a="prev" title="Sebelumnya">⏮</button>
      <button type="button" data-a="toggle" title="Putar/Jeda">⏯</button>
      <button type="button" data-a="next" title="Berikutnya">⏭</button>
    </div>
    <div class="members" id="members"></div>
    <h4>Antrian</h4>
    <ul id="queue"></ul>
  </section>
  <section id="requests" hidden>
    <b>Tambah lagu</b>
    <form id="req-form">
      <input id="req-text" maxlength="200" required placeholder="Judul lagu atau link Spotify" />
      <button>Request</button>
    </form>
    <ul id="req-list"></ul>
  </section>
  <small>Buka YouTube, YouTube Music, atau open.spotify.com, lalu tekan Gabung di tab itu.</small>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
